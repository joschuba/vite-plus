[package]
name = "vp_doc_cli"
version = "0.0.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true

[dependencies]
node-semver = { workspace = true }
serde = { workspace = true, features = ["derive"] }
# `preserve_order` keeps `DocInfoReport::to_json` emitting the documented
# key order; without it the shape only holds through feature unification.
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror = { workspace = true }
vp_migration = { workspace = true }
vp_static_config = { workspace = true }
vt_path = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lib]
doctest = false

[lints]
workspace = true
